<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Nodehouse — powered by Nodehouse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html,
    body {
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
      overscroll-behavior: none;
    }
    body {
      position: relative;
      font-family: 'Courier New', monospace;
    }
    #terminal-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      padding: clamp(4px, 0.75vw, 12px);
      background: #0a0a0a;
    }
    #terminal,
    #terminal .xterm {
      width: 100%;
      height: 100%;
    }
    #terminal .xterm-viewport {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    #terminal .xterm-viewport::-webkit-scrollbar {
      display: none;
    }
    #status {
      position: fixed;
      right: max(8px, env(safe-area-inset-right));
      bottom: max(8px, env(safe-area-inset-bottom));
      z-index: 1001;
      color: #888;
      background: rgba(10, 10, 10, 0.82);
      border: 1px solid #2a2a2a;
      border-radius: 999px;
      font-size: 11px;
      line-height: 1;
      padding: 6px 9px;
      pointer-events: none;
    }
    #status.connected { color: #00ff88; }
    #status.disconnected { color: #ff4444; }
    .scanline {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.03) 0px,
        rgba(0,0,0,0.03) 1px,
        transparent 1px,
        transparent 2px
      );
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="terminal-container">
    <div id="terminal"></div>
  </div>
  <div id="status" role="status" aria-live="polite">Connecting...</div>
  <div class="scanline"></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-web-links@0.11.0/lib/addon-web-links.min.js"></script>
  <script>
    const term = new window.Terminal({
      cursorBlink: true,
      cursorStyle: 'block',
      fontFamily: "'Courier New', 'Lucida Console', monospace",
      fontSize: 16,
      lineHeight: 1.1,
      scrollback: 1000,
      theme: {
        background: '#0a0a0a',
        foreground: '#aaaaaa',
        cursor: '#00ff88',
        cursorAccent: '#0a0a0a',
        selectionBackground: '#00bfff44',
        black: '#000000',
        red: '#aa0000',
        green: '#00aa00',
        yellow: '#aa5500',
        blue: '#0000aa',
        magenta: '#aa00aa',
        cyan: '#00aaaa',
        white: '#aaaaaa',
        brightBlack: '#555555',
        brightRed: '#ff5555',
        brightGreen: '#55ff55',
        brightYellow: '#ffff55',
        brightBlue: '#5555ff',
        brightMagenta: '#ff55ff',
        brightCyan: '#55ffff',
        brightWhite: '#ffffff',
      }
    });

    const fitAddon = new window.FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.loadAddon(new window.WebLinksAddon.WebLinksAddon());

    const container = document.getElementById('terminal');
    term.open(container);

    let fitFrame;
    function fitTerminal() {
      cancelAnimationFrame(fitFrame);
      fitFrame = requestAnimationFrame(() => fitAddon.fit());
    }

    const resizeObserver = new ResizeObserver(fitTerminal);
    resizeObserver.observe(document.getElementById('terminal-container'));
    window.addEventListener('resize', fitTerminal);
    window.visualViewport?.addEventListener('resize', fitTerminal);
    document.fonts?.ready.then(fitTerminal);
    container.addEventListener('pointerdown', () => term.focus());
    fitTerminal();

    const statusEl = document.getElementById('status');
    let ws;

    function connect() {
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(proto + '//' + location.host + '/ws');

      ws.onopen = () => {
        statusEl.textContent = 'Connected';
        statusEl.className = 'connected';
      };

      ws.onmessage = (event) => {
        term.write(event.data);
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected - Refresh to reconnect';
        statusEl.className = 'disconnected';
        term.write('\r\n\x1b[91m--- Connection closed ---\x1b[0m\r\n');
      };

      ws.onerror = () => {
        statusEl.textContent = 'Connection error';
        statusEl.className = 'disconnected';
      };
    }

    term.onData((data) => {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(data);
      }
    });

    connect();
  </script>
</body>
</html>
