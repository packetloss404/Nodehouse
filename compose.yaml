services:
  nodehouse:
    build:
      context: .
    image: nodehouse:local
    container_name: nodehouse
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8088
      TELNET_PORT: 2323
      TRUST_PROXY: "1"
      NODEHOUSE_DB_PATH: /app/data/nodehouse.db
      NODEHOUSE_ALLOWED_ORIGINS: https://bbs.packetloss404.com
      NODEHOUSE_PUBLIC_WEB_URL: https://bbs.packetloss404.com
      NODEHOUSE_PUBLIC_TELNET_HOST: telnet.packetloss404.com
      NODEHOUSE_PUBLIC_TELNET_PORT: "23"
    ports:
      - "8088:8088"
      - "23:2323"
    volumes:
      - ./data:/app/data
      - ./files:/app/files
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8088/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
